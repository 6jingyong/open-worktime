name: Static checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check JavaScript syntax
        run: node --check app.js

      - name: Validate JSON files
        run: |
          python -m json.tool data/brands.json > /dev/null
          python -m json.tool data/demo-distribution.json > /dev/null
          python -m json.tool schema/report.schema.json > /dev/null

      - name: Check required static files
        run: |
          test -s index.html
          test -s styles.css
          test -s app.js
          test -s README.md
